name: Compilar GastoTrack APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' | head -n 1)")
          echo "Compilando proyecto en: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK listo para instalar
        uses: actions/upload-artifact@v4
        with:
          name: GastoTrack-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
