name: Compilar y Publicar GastoTrack APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/GastoTrack-v1.0.0.apk

      - name: Subir artefacto interno
        uses: actions/upload-artifact@v4
        with:
          name: GastoTrack-debug-apk
          path: release-artifacts/GastoTrack-v1.0.0.apk

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/GastoTrack-v1.0.0.apk
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'GastoTrack v1.0.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
