name: Compilar y Publicar GastoTrack APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permisos y normalizar gradlew
        run: |
          dos2unix gradlew 2>/dev/null || sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Compilar APK Debug
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p release-artifacts
          TAG_NAME="${GITHUB_REF_NAME:-v1.1.0}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-artifacts/GastoTrack-${TAG_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/GastoTrack-latest.apk

      - name: Subir artefacto interno
        uses: actions/upload-artifact@v4
        with:
          name: GastoTrack-debug-apk
          path: release-artifacts/*.apk

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts/*.apk
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'GastoTrack v1.1.0' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
